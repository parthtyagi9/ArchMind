[project]
name = "recallops-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pymongo>=4.13",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "google-genai>=1.30",
    "langgraph>=0.6",
    "itsdangerous>=2.2",
    "tree-sitter>=0.26.1",
    "tree-sitter-java>=0.23.5",
    "tree-sitter-typescript>=0.23.2",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-go>=0.25.0",
    "tree-sitter-kotlin>=1.1.0",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "mongomock>=4.3"]

[tool.uv]
package = false
